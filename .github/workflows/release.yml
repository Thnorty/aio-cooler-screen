# Builds the app and installer from source on GitHub's Windows runners.
# A version tag (v1.2.3) also attaches the installer to a draft release; run it by hand to just build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match Cargo.toml version $version."
          }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: cargo test --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1
        env:
          # Font downloads use the GitHub API, which rate-limits anonymous requests.
          GH_TOKEN: ${{ github.token }}

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, target\release\aio-screen.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash)  $($_.Name)"
          } | Tee-Object dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: aio-cooler-screen
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            target/release/aio-screen.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aio-cooler-screen
          path: out

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(ls out/dist/*.exe)
          sha=$(grep "$(basename "$installer")" out/dist/SHA256SUMS.txt | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" "$installer" out/dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          SHA-256 of the installer: \`$sha\`"
